<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Interviewer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <style>
    body { 
      padding: 20px; 
      background: #f5f6fa; 
      font-family: 'Segoe UI', sans-serif;
    }
    .chat-box { 
      height: 400px; 
      overflow-y: auto; 
      border: 1px solid #ddd; 
      padding: 15px; 
      border-radius: 15px; 
      background: #fff; 
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
    }
    .user-msg { 
      text-align: right; 
      color: #0d6efd; 
      margin: 10px 0; 
      font-weight: 500;
    }
    .ai-msg { 
      text-align: left; 
      color: #198754; 
      margin: 10px 0; 
      font-weight: 500;
    }
    .btn-custom {
      border-radius: 50px;
      padding: 10px 25px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="text-center mb-4">
      <h2>AI Interviewer</h2>
      <p class="text-muted">Upload your resume and practice with an AI-powered interviewer.</p>
    </div>

    <div class="mb-3">
      <input type="file" id="resumeUpload" accept="application/pdf" class="form-control">
    </div>
    <div class="mb-4 d-flex justify-content-center gap-2">
      <button class="btn btn-primary btn-custom" onclick="analyzeResume()">Start Interview</button>
    </div>

    <div class="chat-box mb-3" id="chatBox"></div>

    <div class="input-group mb-4">
      <input type="text" id="userAnswer" class="form-control" placeholder="Type your answer..." disabled>
      <button class="btn btn-success btn-custom" onclick="sendAnswer()" disabled id="sendBtn">Send</button>
    </div>
  </div>

  <script>
    let resumeText = "";
    let currentQuestionIndex = 0;
    let questions = [];
    let allFeedback = [];

    async function extractTextFromPDF(file) {
      const pdf = await pdfjsLib.getDocument(URL.createObjectURL(file)).promise;
      let text = "";
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        text += content.items.map(item => item.str).join(" ");
      }
      return text;
    }

    async function callOpenAI(prompt) {
      try {
        const response = await fetch('/api/openai', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt })
        });
        const data = await response.json();
        return data.choices?.[0]?.message?.content?.trim() ?? JSON.stringify(data);
      } catch (error) {
        console.error(error);
        return "Error: Unable to get response from AI.";
      }
    }

    async function analyzeResume() {
      const file = document.getElementById("resumeUpload").files[0];
      if (!file) {
        alert("Please upload a resume first.");
        return;
      }
      resumeText = await extractTextFromPDF(file);

      const prompt = `You are an interviewer. Based on this resume:\n${resumeText}\n
      Generate 3 simple and straight to the point interview questions. Only output numbered questions.`;

      const result = await callOpenAI(prompt);
      questions = result.split("\n").filter(q => q.trim() !== "").slice(0,3);
      currentQuestionIndex = 0;
      allFeedback = [];

      showMessage("AI", "Welcome! Let's start your interview. Here's your first question:");
      askNextQuestion();

      document.getElementById("userAnswer").disabled = false;
      document.getElementById("sendBtn").disabled = false;
    }

    function askNextQuestion() {
      if (currentQuestionIndex < questions.length) {
        showMessage("AI", questions[currentQuestionIndex]);
      } else {
        finalizeInterview();
      }
    }

    async function sendAnswer() {
      const answer = document.getElementById("userAnswer").value.trim();
      if (!answer) return;
      showMessage("You", answer);
      document.getElementById("userAnswer").value = "";

      const reviewPrompt = `Here is the question: "${questions[currentQuestionIndex]}". 
      Here is the candidate's answer: "${answer}". 
      Give short feedback (1-2 sentences) and a rating out of 5 like an interviewer.`;

      const feedback = await callOpenAI(reviewPrompt);
      allFeedback.push(feedback);
      showMessage("AI", `Feedback: ${feedback}`);

      currentQuestionIndex++;
      setTimeout(askNextQuestion, 1500);
    }

    async function finalizeInterview() {
      const finalPrompt = `Here are the candidate's answers and feedbacks:\n${allFeedback.join("\n")}
      Give a final overall feedback, total rating out of 5, and mention if the candidate passed the interview or not.`;

      const finalFeedback = await callOpenAI(finalPrompt);
      showMessage("AI", "🎯 Final Feedback:\n" + finalFeedback);

      document.getElementById("userAnswer").disabled = true;
      document.getElementById("sendBtn").disabled = true;
    }

    function showMessage(sender, text) {
      const chatBox = document.getElementById("chatBox");
      const msg = document.createElement("div");
      msg.className = sender === "You" ? "user-msg" : "ai-msg";
      msg.textContent = `${sender}: ${text}`;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
